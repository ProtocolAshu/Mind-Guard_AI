# Render blueprint for the MindGuard API (free instance type).
# Untested in this repository's build environment — deploy once and adjust if Render's schema changes.
# The database and cache are external free services (Neon for PostgreSQL+pgvector, Upstash for Redis);
# run `alembic upgrade head` against the Neon URL from your machine before the first deploy.
services:
  - type: web
    name: mindguard-api
    runtime: docker
    dockerfilePath: ./infra/docker/backend.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false   # paste the Neon connection string
      - key: REDIS_URL
        sync: false   # paste the Upstash rediss:// URL (optional)
      - key: CORS_ORIGINS
        sync: false   # https://<your-app>.vercel.app
      - key: ADMIN_EMAILS
        sync: false
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_API_KEY
        sync: false
